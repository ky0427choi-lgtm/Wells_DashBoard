name: Deploy to GAS & GitHub Pages

on:
  push:
    branches: [main]

jobs:
  calculation-gate:
    name: Verify calculation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run deterministic calculation tests
        run: node calculation-contract.test.js

  deploy-gas:
    name: Push GAS Backend
    runs-on: ubuntu-latest
    needs: calculation-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install -g @google/clasp
      - name: clasp login
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json
      - name: Push to GAS
        working-directory: ./backend
        run: clasp push --force
      - name: Update existing GAS web app deployment
        working-directory: ./backend
        run: clasp deploy -i AKfycby-N6xTg8YK-BoHLUpTLnLIMcJDMUjOiP1bXjVgYFsdaYzY1h-yznd37GxPwCQcNCtOug -d "Accuracy contract $GITHUB_SHA"

  deploy-pages:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-gas
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: './frontend' }
      - id: deployment
        uses: actions/deploy-pages@v4
